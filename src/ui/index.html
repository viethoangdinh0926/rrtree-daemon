<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rrtree — live request trees</title>
    <style>
      :root {
        --bg: #0f1419;
        --panel: #1a2332;
        --border: #2d3a4d;
        --text: #e7ecf3;
        --muted: #8b9bb4;
        --accent: #3d9cf0;
        --redirect: #e0a106;
        --parser: #6bcb77;
        --script: #c792ea;
        --script_nav: #ff6b9d;
        --user_interaction: #4fd1c5;
        --preload: #718096;
        --other: #a0aec0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background: radial-gradient(1200px 600px at 10% -10%, #1a2a44, var(--bg));
        color: var(--text);
        min-height: 100vh;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 1rem;
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--border);
        background: color-mix(in srgb, var(--panel) 80%, transparent);
        backdrop-filter: blur(8px);
        position: sticky;
        top: 0;
        z-index: 2;
      }
      h1 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .status {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .status.ok {
        color: var(--parser);
      }
      main {
        display: grid;
        grid-template-columns: 280px 1fr 360px;
        gap: 0;
        min-height: calc(100vh - 57px);
      }
      @media (max-width: 960px) {
        main {
          grid-template-columns: 1fr;
        }
      }
      aside,
      section,
      article {
        border-right: 1px solid var(--border);
        padding: 0.75rem;
        overflow: auto;
        max-height: calc(100vh - 57px);
      }
      article {
        border-right: none;
      }
      h2 {
        margin: 0 0 0.75rem;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .tree-list button,
      .node {
        display: block;
        width: 100%;
        text-align: left;
        background: transparent;
        border: 1px solid transparent;
        color: var(--text);
        padding: 0.45rem 0.55rem;
        border-radius: 6px;
        cursor: pointer;
        font: inherit;
        margin-bottom: 0.25rem;
      }
      .tree-list button:hover,
      .node:hover {
        background: var(--panel);
        border-color: var(--border);
      }
      .tree-list button.active {
        border-color: var(--accent);
        background: color-mix(in srgb, var(--accent) 15%, transparent);
      }
      .toolbar {
        display: flex;
        gap: 0.4rem;
        margin-bottom: 0.75rem;
        flex-wrap: wrap;
      }
      .toolbar button {
        flex: 1;
        min-width: 0;
        font: inherit;
        font-size: 0.75rem;
        padding: 0.4rem 0.5rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
      }
      .toolbar button:hover:not(:disabled) {
        border-color: var(--accent);
      }
      .toolbar button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .toolbar button.danger:hover:not(:disabled) {
        border-color: #e06c75;
        color: #ffb4b4;
      }
      .tree-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.25rem;
        align-items: stretch;
        margin-bottom: 0.25rem;
      }
      .tree-row .pick {
        margin-bottom: 0;
      }
      .tree-row .del {
        width: 2rem;
        padding: 0;
        margin: 0;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 1rem;
        line-height: 1;
      }
      .tree-row .del:hover {
        color: #ffb4b4;
        border-color: var(--border);
        background: var(--panel);
      }
      .curl-block {
        position: relative;
      }
      .curl-block .copy-row {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 0.35rem;
      }
      .curl-block button {
        font: inherit;
        font-size: 0.72rem;
        padding: 0.3rem 0.55rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
      }
      .curl-block button:hover {
        border-color: var(--accent);
      }
      .curl-block pre {
        margin-top: 0;
      }
      .node.selected {
        border-color: var(--accent);
        background: color-mix(in srgb, var(--accent) 12%, transparent);
      }
      .edge {
        display: inline-block;
        font-size: 0.65rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 0.1rem 0.35rem;
        border-radius: 3px;
        margin-right: 0.35rem;
        background: var(--border);
        color: var(--bg);
      }
      .edge.redirect {
        background: var(--redirect);
      }
      .edge.parser {
        background: var(--parser);
      }
      .edge.script {
        background: var(--script);
      }
      .edge.script_nav {
        background: var(--script_nav);
      }
      .edge.user_interaction {
        background: var(--user_interaction);
      }
      .edge.preload {
        background: var(--preload);
      }
      .url {
        word-break: break-all;
        font-size: 0.82rem;
      }
      .meta {
        color: var(--muted);
        font-size: 0.72rem;
        margin-top: 0.15rem;
      }
      .children {
        margin-left: 0.85rem;
        border-left: 1px dashed var(--border);
        padding-left: 0.35rem;
      }
      .toggle {
        display: inline-block;
        width: 1rem;
        color: var(--muted);
        user-select: none;
      }
      pre {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.75rem;
        overflow: auto;
        font-size: 0.75rem;
        max-height: 50vh;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }
      dl {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 0.35rem 0.5rem;
        font-size: 0.85rem;
        margin: 0 0 1rem;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        word-break: break-all;
      }
      .filter-section {
        margin-bottom: 0.75rem;
        padding: 0.5rem;
        background: var(--panel);
        border-radius: 6px;
        border: 1px solid var(--border);
      }
      .filter-label {
        font-size: 0.72rem;
        color: var(--muted);
        margin-bottom: 0.4rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .filter-options {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }
      .filter-option {
        display: flex;
        align-items: center;
        gap: 0.25rem;
        font-size: 0.75rem;
        cursor: pointer;
      }
      .filter-option input {
        cursor: pointer;
      }
      .filter-option span {
        text-transform: capitalize;
      }
      .capture-toggle {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.85rem;
      }
      .capture-toggle input {
        cursor: pointer;
        width: 1rem;
        height: 1rem;
      }
      .capture-toggle label {
        cursor: pointer;
        user-select: none;
      }
      .context-menu {
        position: fixed;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.25rem;
        min-width: 150px;
        z-index: 1000;
        display: none;
      }
      .context-menu button {
        display: block;
        width: 100%;
        text-align: left;
        background: transparent;
        border: none;
        color: var(--text);
        padding: 0.4rem 0.6rem;
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
        border-radius: 4px;
      }
      .context-menu button:hover {
        background: var(--accent);
        color: var(--bg);
      }
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 2000;
      }
      .modal {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1.25rem;
        max-width: 800px;
        max-height: 80vh;
        width: 90%;
        display: flex;
        flex-direction: column;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }
      .modal-title {
        font-size: 1rem;
        font-weight: 600;
      }
      .modal-close {
        background: transparent;
        border: none;
        color: var(--muted);
        font-size: 1.5rem;
        cursor: pointer;
        padding: 0;
        line-height: 1;
      }
      .modal-close:hover {
        color: var(--text);
      }
      .modal-body {
        flex: 1;
        overflow: auto;
        margin-bottom: 1rem;
      }
      .modal-body pre {
        margin: 0;
        font-size: 0.75rem;
      }
      .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
      }
      .modal-footer button {
        font: inherit;
        font-size: 0.85rem;
        padding: 0.4rem 0.8rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
      }
      .modal-footer button:hover {
        border-color: var(--accent);
      }
      .modal-footer button.primary {
        background: var(--accent);
        color: var(--bg);
        border-color: var(--accent);
      }
      .modal-footer button.primary:hover {
        background: #2b8bd6;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>rrtree</h1>
      <div class="capture-toggle">
        <input type="checkbox" id="capture-toggle" checked>
        <label for="capture-toggle">Capture requests</label>
      </div>
      <span id="status" class="status">connecting…</span>
    </header>
    <main>
      <aside>
        <h2>Trees</h2>
        <div class="toolbar">
          <button type="button" id="btn-delete-selected" class="danger" disabled>
            Delete selected
          </button>
          <button type="button" id="btn-reset-tree" disabled>
            Reset tree
          </button>
          <button type="button" id="btn-clear-all" class="danger">
            Clear all
          </button>
        </div>
        <div id="tree-list" class="tree-list"></div>
      </aside>
      <section>
        <h2>Request tree</h2>
        <div class="filter-section">
          <div class="filter-label">Filter by edge type</div>
          <div class="filter-options" id="edge-type-filters">
            <label class="filter-option">
              <input type="checkbox" value="redirect" checked>
              <span>Redirect</span>
            </label>
            <label class="filter-option">
              <input type="checkbox" value="parser" checked>
              <span>Parser</span>
            </label>
            <label class="filter-option">
              <input type="checkbox" value="script" checked>
              <span>Script</span>
            </label>
            <label class="filter-option">
              <input type="checkbox" value="script_nav" checked>
              <span>Script Nav</span>
            </label>
            <label class="filter-option">
              <input type="checkbox" value="user_interaction" checked>
              <span>User Interaction</span>
            </label>
            <label class="filter-option">
              <input type="checkbox" value="preload" checked>
              <span>Preload</span>
            </label>
            <label class="filter-option">
              <input type="checkbox" value="other" checked>
              <span>Other</span>
            </label>
          </div>
        </div>
        <div id="tree-view"></div>
      </section>
      <article>
        <h2>Selected RR</h2>
        <div id="detail"><p class="meta">Select a node</p></div>
      </article>
    </main>

    <div id="context-menu" class="context-menu">
      <button type="button" id="ctx-reroot">Re-root tree here</button>
      <button type="button" id="ctx-export-json">Export tree as JSON</button>
    </div>

    <div id="json-modal" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h3 class="modal-title">Subtree JSON</h3>
          <button type="button" class="modal-close" id="modal-close">×</button>
        </div>
        <div class="modal-body">
          <pre id="json-content"></pre>
        </div>
        <div class="modal-footer">
          <button type="button" id="modal-copy" class="primary">Copy to clipboard</button>
          <button type="button" id="modal-cancel">Close</button>
        </div>
      </div>
    </div>
    <script>
      const state = {
        trees: [],
        nodesByTree: new Map(),
        selectedTreeId: null,
        selectedNodeId: null,
        collapsed: new Set(),
        edgeTypeFilters: new Set(
          JSON.parse(localStorage.getItem("edgeTypeFilters") || '["redirect", "parser", "script", "script_nav", "user_interaction", "preload", "other"]')
        ),
        contextMenuNodeId: null,
      };

      const el = {
        status: document.getElementById("status"),
        treeList: document.getElementById("tree-list"),
        treeView: document.getElementById("tree-view"),
        detail: document.getElementById("detail"),
        btnDeleteSelected: document.getElementById("btn-delete-selected"),
        btnResetTree: document.getElementById("btn-reset-tree"),
        btnClearAll: document.getElementById("btn-clear-all"),
        edgeTypeFilters: document.getElementById("edge-type-filters"),
        captureToggle: document.getElementById("capture-toggle"),
        contextMenu: document.getElementById("context-menu"),
        ctxReroot: document.getElementById("ctx-reroot"),
        ctxExportJson: document.getElementById("ctx-export-json"),
        jsonModal: document.getElementById("json-modal"),
        jsonContent: document.getElementById("json-content"),
        modalClose: document.getElementById("modal-close"),
        modalCopy: document.getElementById("modal-copy"),
        modalCancel: document.getElementById("modal-cancel"),
      };

      async function refreshTrees() {
        const res = await fetch("/trees");
        const data = await res.json();
        state.trees = data.trees || [];
        // Sort trees by createdAt to maintain consistent order
        state.trees.sort((a, b) => a.createdAt - b.createdAt);
        // Drop cached nodes for trees that no longer exist.
        for (const id of state.nodesByTree.keys()) {
          if (!state.trees.some((t) => t.id === id)) state.nodesByTree.delete(id);
        }
        if (
          state.selectedTreeId &&
          !state.trees.some((t) => t.id === state.selectedTreeId)
        ) {
          state.selectedTreeId = null;
          state.selectedNodeId = null;
          renderDetail(null);
        }
        renderTreeList();
        if (!state.selectedTreeId && state.trees.length) {
          await selectTree(state.trees[state.trees.length - 1].id);
        } else if (state.selectedTreeId) {
          await loadTree(state.selectedTreeId);
        } else {
          renderTree();
        }
      }

      async function loadTree(id) {
        const res = await fetch(`/trees/${encodeURIComponent(id)}`);
        if (!res.ok) {
          if (res.status === 404) {
            removeTreeLocal(id);
            renderTreeList();
            renderTree();
          }
          return;
        }
        const data = await res.json();
        const map = new Map();
        for (const n of data.nodes || []) map.set(n.id, n);
        state.nodesByTree.set(id, map);
        // Update tree metadata if present
        if (data.tree) {
          const existing = state.trees.find((t) => t.id === id);
          if (existing) {
            Object.assign(existing, data.tree);
          }
        }
        renderTree();
      }

      async function selectTree(id) {
        state.selectedTreeId = id;
        state.selectedNodeId = null;
        renderTreeList();
        await loadTree(id);
        renderDetail(null);
      }

      function removeTreeLocal(treeId) {
        state.trees = state.trees.filter((t) => t.id !== treeId);
        // Sort trees by createdAt to maintain consistent order
        state.trees.sort((a, b) => a.createdAt - b.createdAt);
        state.nodesByTree.delete(treeId);
        if (state.selectedTreeId === treeId) {
          state.selectedTreeId = null;
          state.selectedNodeId = null;
          renderDetail(null);
        }
      }

      async function deleteTree(treeId) {
        if (!treeId) return;
        const res = await fetch(`/trees/${encodeURIComponent(treeId)}`, {
          method: "DELETE",
        });
        if (!res.ok && res.status !== 404) {
          el.status.textContent = "delete failed";
          return;
        }
        removeTreeLocal(treeId);
        renderTreeList();
        if (!state.selectedTreeId && state.trees.length) {
          await selectTree(state.trees[0].id);
        } else {
          renderTree();
        }
        el.status.textContent = `live · ${state.trees.length} trees`;
      }

      async function clearAllTrees() {
        if (!state.trees.length) return;
        if (!confirm(`Delete all ${state.trees.length} trees?`)) return;
        const res = await fetch("/trees", { method: "DELETE" });
        if (!res.ok) {
          el.status.textContent = "clear failed";
          return;
        }
        state.trees = [];
        state.nodesByTree.clear();
        state.selectedTreeId = null;
        state.selectedNodeId = null;
        renderTreeList();
        renderTree();
        renderDetail(null);
        el.status.textContent = "live · 0 trees";
      }

      function upsertNode(patch) {
        const { treeId, node } = patch;
        if (!treeId || !node) return;
        if (!state.nodesByTree.has(treeId)) state.nodesByTree.set(treeId, new Map());
        state.nodesByTree.get(treeId).set(node.id, node);
        if (!state.trees.some((t) => t.id === treeId)) {
          state.trees.push({
            id: treeId,
            rootId: node.parentId ? undefined : node.id,
            originalRootId: node.parentId ? undefined : node.id,
            updatedAt: node.updatedAt,
            createdAt: node.createdAt,
            targetId: node.targetId,
          });
          // Sort trees by createdAt to maintain consistent order
          state.trees.sort((a, b) => a.createdAt - b.createdAt);
        } else {
          const t = state.trees.find((t) => t.id === treeId);
          if (t) {
            t.updatedAt = node.updatedAt;
            if (!node.parentId) {
              t.rootId = node.id;
              if (!t.originalRootId) t.originalRootId = node.id;
            }
          }
        }
        if (state.selectedTreeId === treeId) {
          renderTreeList();
          renderTree();
          if (state.selectedNodeId === node.id) renderDetail(node);
        } else {
          renderTreeList();
        }
      }

      function renderTreeList() {
        const sorted = [...state.trees].sort((a, b) => b.updatedAt - a.updatedAt);
        el.treeList.innerHTML = sorted
          .map((t) => {
            const nodes = state.nodesByTree.get(t.id);
            const root = nodes?.get(t.rootId);
            const label = root?.url || t.id;
            const short = label.length > 48 ? label.slice(0, 45) + "…" : label;
            const active = t.id === state.selectedTreeId ? "active" : "";
            return `<div class="tree-row">
              <button type="button" class="pick ${active}" data-id="${t.id}" title="${escapeAttr(label)}">${escapeHtml(short)}<div class="meta">${nodes?.size || "?"} nodes</div></button>
              <button type="button" class="del" data-id="${t.id}" title="Delete tree" aria-label="Delete tree">×</button>
            </div>`;
          })
          .join("");
        el.treeList.querySelectorAll("button.pick").forEach((btn) => {
          btn.addEventListener("click", () => selectTree(btn.dataset.id));
        });
        el.treeList.querySelectorAll("button.del").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            void deleteTree(btn.dataset.id);
          });
        });
        el.btnDeleteSelected.disabled = !state.selectedTreeId;
      }

      function renderTree() {
        const id = state.selectedTreeId;
        if (!id) {
          el.treeView.innerHTML = `<p class="meta">No tree selected</p>`;
          return;
        }
        const nodes = state.nodesByTree.get(id);
        const tree = state.trees.find((t) => t.id === id);
        if (!nodes || !tree) {
          el.treeView.innerHTML = `<p class="meta">Loading…</p>`;
          return;
        }
        const root = nodes.get(tree.rootId);
        if (!root) {
          el.treeView.innerHTML = `<p class="meta">Empty tree</p>`;
          return;
        }
        if (!isNodeVisible(root, 0)) {
          el.treeView.innerHTML = `<p class="meta">No nodes match the current filter</p>`;
          return;
        }
        el.treeView.innerHTML = renderNodeHtml(root, nodes, 0);
        el.treeView.querySelectorAll(".node").forEach((n) => {
          n.addEventListener("click", (e) => {
            e.stopPropagation();
            const nid = n.dataset.id;
            state.selectedNodeId = nid;
            renderTree();
            renderDetail(nodes.get(nid));
          });
          n.addEventListener("contextmenu", (e) => {
            e.preventDefault();
            showContextMenu(e.clientX, e.clientY, n.dataset.id);
          });
        });
        el.treeView.querySelectorAll(".toggle").forEach((t) => {
          t.addEventListener("click", (e) => {
            e.stopPropagation();
            const nid = t.dataset.id;
            if (state.collapsed.has(nid)) state.collapsed.delete(nid);
            else state.collapsed.add(nid);
            renderTree();
          });
        });

        // Update reset button state
        const canReset = !!tree.effectiveRootId;
        el.btnResetTree.disabled = !canReset;
      }

      function isNodeVisible(node, depth) {
        const edgeType = node.edgeType || (depth === 0 ? "other" : null);
        if (!edgeType) return true;
        return state.edgeTypeFilters.has(edgeType);
      }

      function renderNodeHtml(node, nodes, depth) {
        const kids = (node.children || [])
          .map((cid) => nodes.get(cid))
          .filter(Boolean);
        const visibleKids = kids.filter(k => isNodeVisible(k, depth + 1));
        const hasKids = visibleKids.length > 0;
        const collapsed = state.collapsed.has(node.id);
        const selected = node.id === state.selectedNodeId ? "selected" : "";
        
        let edge;
        if (node.edgeType) {
          edge = `<span class="edge ${node.edgeType}">${node.edgeType}</span>`;
        } else if (depth === 0) {
          edge = `<span class="edge other">root</span>`;
        } else {
          edge = "";
        }
        
        let status;
        if (node.status != null) {
          status = node.status;
        } else if (node.failed) {
          status = "ERR";
        } else if (node.hasResponse) {
          status = "…";
        } else {
          status = "→";
        }
        
        const toggleHtml = hasKids 
          ? `<span class="toggle" data-id="${node.id}">${collapsed ? "▶" : "▼"}</span>`
          : `<span class="toggle"> </span>`;
        
        const mimeTypeHtml = node.mimeType ? " · " + escapeHtml(node.mimeType) : "";
        
        let html = `<div class="node ${selected}" data-id="${node.id}">
          <div>${toggleHtml}${edge}<span class="url">${escapeHtml(node.method)} ${escapeHtml(shortUrl(node.url))}</span></div>
          <div class="meta">${escapeHtml(String(node.resourceType))} · ${status}${mimeTypeHtml}</div>
        </div>`;
        if (hasKids && !collapsed) {
          html += `<div class="children">${visibleKids.map((k) => renderNodeHtml(k, nodes, depth + 1)).join("")}</div>`;
        }
        return html;
      }

      const CRUCIAL_HEADERS = new Set([
        "authorization",
        "content-type",
        "cookie",
        "accept",
        "x-api-key",
        "x-auth-token",
        "x-csrf-token",
        "x-xsrf-token",
        "x-requested-with",
      ]);

      function shellSingleQuote(value) {
        const quotePattern = String.raw`'\\''`;
        return "'" + String(value).replaceAll("'", quotePattern) + "'";
      }

      function nodeToCurl(node) {
        const method = (node.method || "GET").toUpperCase();
        const parts = ["curl"];
        if (method !== "GET") parts.push("-X", method);

        // Deduplicate headers by lowercase name (HTTP headers are case-insensitive).
        // Keep the last occurrence for each header name.
        const deduped = new Map();
        for (const [name, value] of Object.entries(node.requestHeaders || {})) {
          if (!value) continue;
          const lower = name.toLowerCase();
          if (!CRUCIAL_HEADERS.has(lower)) continue;
          
          let display;
          if (lower === "content-type") {
            display = "Content-Type";
          } else if (lower === "authorization") {
            display = "Authorization";
          } else if (lower === "cookie") {
            display = "Cookie";
          } else if (lower === "accept") {
            display = "Accept";
          } else {
            display = name;
          }
          deduped.set(lower, [display, value]);
        }
        const headers = Array.from(deduped.values())
          .sort((a, b) => a[0].localeCompare(b[0]));

        for (const [name, value] of headers) {
          parts.push("-H", shellSingleQuote(`${name}: ${value}`));
        }

        const bodyText = node.requestBody && node.requestBody.text;
        if (bodyText && method !== "GET" && method !== "HEAD") {
          parts.push("--data-binary", shellSingleQuote(bodyText));
        }
        parts.push(shellSingleQuote(node.url));
        return parts.join(" ");
      }

      function renderDetail(node) {
        if (!node) {
          el.detail.innerHTML = `<p class="meta">Select a node</p>`;
          return;
        }
        const reqBody = formatBody(node.requestBody);
        const resBody = formatBody(node.responseBody) ||
          (node.bodyPreview
            ? escapeHtml(node.bodyPreview.slice(0, 16000))
            : `<span class="meta">—</span>`);
        const curl = nodeToCurl(node);
        el.detail.innerHTML = `
          <dl>
            <dt>URL</dt><dd>${escapeHtml(node.url)}</dd>
            <dt>Method</dt><dd>${escapeHtml(node.method)}</dd>
            <dt>Type</dt><dd>${escapeHtml(node.resourceType)}</dd>
            <dt>Status</dt><dd>${node.status ?? "—"} ${escapeHtml(node.statusText || "")}</dd>
            <dt>Edge</dt><dd>${escapeHtml(node.edgeType || "root")}</dd>
            <dt>Initiator</dt><dd>${escapeHtml(node.initiator?.type || "—")}</dd>
            <dt>MIME</dt><dd>${escapeHtml(node.mimeType || "—")}</dd>
            <dt>Request ID</dt><dd>${escapeHtml(node.requestId)}</dd>
          </dl>
          <h2>curl</h2>
          <div class="curl-block">
            <div class="copy-row">
              <button type="button" id="btn-copy-curl">Copy curl</button>
            </div>
            <pre id="curl-cmd">${escapeHtml(curl)}</pre>
          </div>
          <h2>Request headers</h2>
          <pre>${escapeHtml(JSON.stringify(node.requestHeaders || {}, null, 2))}</pre>
          <h2>Request body</h2>
          <pre>${reqBody}</pre>
          <h2>Response headers</h2>
          <pre>${escapeHtml(JSON.stringify(node.responseHeaders || {}, null, 2))}</pre>
          <h2>Response body</h2>
          <pre>${resBody}</pre>
          ${node.errorText ? `<h2>Error</h2><pre>${escapeHtml(node.errorText)}</pre>` : ""}
        `;
        const copyBtn = document.getElementById("btn-copy-curl");
        if (copyBtn) {
          copyBtn.addEventListener("click", async () => {
            try {
              await navigator.clipboard.writeText(curl);
              copyBtn.textContent = "Copied";
              setTimeout(() => {
                copyBtn.textContent = "Copy curl";
              }, 1200);
            } catch {
              copyBtn.textContent = "Copy failed";
            }
          });
        }
      }

      function formatBody(body) {
        if (!body) return `<span class="meta">— (none)</span>`;
        if (body.unavailableReason) {
          return `<span class="meta">— (${escapeHtml(body.unavailableReason)})</span>`;
        }
        const note = body.truncated
          ? `\n… truncated (original ${body.size ?? "?"} bytes)`
          : "";
        if (body.text != null) {
          return escapeHtml(body.text.slice(0, 16000) + note);
        }
        if (body.base64) {
          const truncatedNote = body.truncated ? " truncated" : "";
          const base64Preview = body.base64.slice(0, 2000);
          return escapeHtml(
            `[base64 ${body.size ?? "?"} bytes]${truncatedNote}\n${base64Preview}`,
          );
        }
        return `<span class="meta">—</span>`;
      }

      function shortUrl(u) {
        try {
          const x = new URL(u);
          return x.pathname + x.search || x.href;
        } catch {
          return u;
        }
      }
      function escapeHtml(s) {
        return String(s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }
      function escapeAttr(s) {
        return escapeHtml(s).replace(/'/g, "&#39;");
      }

      function formatHealthStatus(health) {
        const cdp = health.cdp || {};
        const targets = health.attachedTargets?.length || 0;
        const trees = health.treeCount || 0;
        const capturing = cdp.capturing !== false;
        if (cdp.state === "scanning") {
          const where = cdp.host && cdp.port ? `${cdp.host}:${cdp.port}` : "CDP";
          return `scanning for Chrome on ${where} · ${trees} trees`;
        }
        return `connected · ${targets} targets · ${trees} trees${capturing ? " · capturing" : " · paused"}`;
      }

      async function loadCapturingState() {
        try {
          const res = await fetch("/capturing");
          const data = await res.json();
          el.captureToggle.checked = data.capturing;
        } catch (e) {
          // Network errors are expected if API is unavailable; use default state
          console.error("Failed to load capturing state:", e);
        }
      }

      async function setCapturingState(enabled) {
        try {
          const res = await fetch("/capturing", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ enabled }),
          });
          if (!res.ok) {
            console.error("Failed to set capturing state");
            el.captureToggle.checked = !enabled;
          }
        } catch (e) {
          // Network errors are expected if API is unavailable; revert UI state
          console.error("Failed to set capturing state:", e);
          el.captureToggle.checked = !enabled;
        }
      }

      async function refreshHealth() {
        try {
          const h = await fetch("/health");
          const health = await h.json();
          el.status.textContent = formatHealthStatus(health);
          if (health.cdp?.state === "connected") el.status.classList.add("ok");
          else el.status.classList.remove("ok");
        } catch (e) {
          // Network errors are expected if API is unavailable; show error state
          el.status.textContent = "API unreachable";
          el.status.classList.remove("ok");
        }
      }

      function showContextMenu(x, y, nodeId) {
        state.contextMenuNodeId = nodeId;
        el.contextMenu.style.display = "block";
        el.contextMenu.style.left = `${x}px`;
        el.contextMenu.style.top = `${y}px`;
      }

      function hideContextMenu() {
        el.contextMenu.style.display = "none";
        state.contextMenuNodeId = null;
      }

      function showModal(json) {
        el.jsonContent.textContent = JSON.stringify(json, null, 2);
        el.jsonModal.style.display = "flex";
      }

      function hideModal() {
        el.jsonModal.style.display = "none";
      }

      async function setEffectiveRootAtNode(nodeId) {
        if (!state.selectedTreeId || !nodeId) return;
        const res = await fetch(`/trees/${encodeURIComponent(state.selectedTreeId)}/effective-root`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ effectiveRootId: nodeId }),
        });
        if (!res.ok) {
          el.status.textContent = "Set effective root failed";
          return;
        }
        await loadTree(state.selectedTreeId);
        renderTreeList();
        renderTree();
        el.status.textContent = `live · ${state.trees.length} trees`;
      }

      async function clearEffectiveRoot() {
        if (!state.selectedTreeId) return;
        const res = await fetch(`/trees/${encodeURIComponent(state.selectedTreeId)}/effective-root`, {
          method: "DELETE",
        });
        if (!res.ok) {
          el.status.textContent = "Clear effective root failed";
          return;
        }
        await loadTree(state.selectedTreeId);
        renderTreeList();
        renderTree();
        // Explicitly update button state
        const tree = state.trees.find((t) => t.id === state.selectedTreeId);
        const canReset = !!tree?.effectiveRootId;
        el.btnResetTree.disabled = !canReset;
        el.status.textContent = `live · ${state.trees.length} trees`;
      }

      async function exportTreeJson() {
        if (!state.contextMenuNodeId) return;
        const filtersParam = Array.from(state.edgeTypeFilters).join(",");
        const url = `/nodes/${encodeURIComponent(state.contextMenuNodeId)}/partial-json?filters=${encodeURIComponent(filtersParam)}`;
        const res = await fetch(url);
        if (!res.ok) {
          el.status.textContent = "Export failed";
          return;
        }
        const data = await res.json();
        showModal(data.json);
      }

      async function connect() {
        try {
          await refreshHealth();
          await refreshTrees();
          await loadCapturingState();
        } catch (e) {
          // Network errors are expected if API is unavailable; show error state
          el.status.textContent = "API unreachable";
          el.status.classList.remove("ok");
        }
        setInterval(() => {
          void refreshHealth();
        }, 2000);

        el.btnDeleteSelected.addEventListener("click", () => {
          if (state.selectedTreeId) void deleteTree(state.selectedTreeId);
        });
        el.btnResetTree.addEventListener("click", () => {
          void clearEffectiveRoot();
        });
        el.btnClearAll.addEventListener("click", () => {
          void clearAllTrees();
        });

        el.captureToggle.addEventListener("change", () => {
          void setCapturingState(el.captureToggle.checked);
        });

        // Context menu handlers
        el.ctxReroot.addEventListener("click", () => {
          void setEffectiveRootAtNode(state.contextMenuNodeId);
          hideContextMenu();
        });

        el.ctxExportJson.addEventListener("click", () => {
          void exportTreeJson();
          hideContextMenu();
        });

        // Close context menu on click outside
        document.addEventListener("click", (e) => {
          if (!el.contextMenu.contains(e.target)) {
            hideContextMenu();
          }
        });

        // Modal handlers
        el.modalClose.addEventListener("click", hideModal);
        el.modalCancel.addEventListener("click", hideModal);
        el.modalCopy.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(el.jsonContent.textContent);
            el.modalCopy.textContent = "Copied!";
            setTimeout(() => {
              el.modalCopy.textContent = "Copy to clipboard";
            }, 1500);
          } catch {
            el.modalCopy.textContent = "Copy failed";
          }
        });

        // Close modal on overlay click
        el.jsonModal.addEventListener("click", (e) => {
          if (e.target === el.jsonModal) {
            hideModal();
          }
        });

        el.edgeTypeFilters.querySelectorAll("input[type='checkbox']").forEach((checkbox) => {
          // Sync checkbox state with loaded filters
          checkbox.checked = state.edgeTypeFilters.has(checkbox.value);
          checkbox.addEventListener("change", () => {
            if (checkbox.checked) {
              state.edgeTypeFilters.add(checkbox.value);
            } else {
              state.edgeTypeFilters.delete(checkbox.value);
            }
            localStorage.setItem("edgeTypeFilters", JSON.stringify([...state.edgeTypeFilters]));
            renderTree();
          });
        });

        const es = new EventSource("/events");
        es.onmessage = (msg) => {
          try {
            const data = JSON.parse(msg.data);
            if (data.op === "snapshot") {
              state.trees = data.trees || state.trees;
              // Sort trees by createdAt to maintain consistent order
              state.trees.sort((a, b) => a.createdAt - b.createdAt);
              renderTreeList();
              return;
            }
            if (data.op === "upsert" || data.op === "attach") {
              upsertNode(data);
              void refreshHealth();
              return;
            }
            if (data.op === "delete" && data.treeId) {
              removeTreeLocal(data.treeId);
              renderTreeList();
              if (!state.selectedTreeId && state.trees.length) {
                void selectTree(state.trees[0].id);
              } else {
                renderTree();
              }
              void refreshHealth();
              return;
            }
            if (data.op === "clear") {
              state.trees = [];
              state.nodesByTree.clear();
              state.selectedTreeId = null;
              state.selectedNodeId = null;
              renderTreeList();
              renderTree();
              renderDetail(null);
              void refreshHealth();
            }
          } catch {
            /* ignore */
          }
        };
        es.onerror = () => {
          el.status.textContent = "SSE reconnecting…";
          el.status.classList.remove("ok");
        };
      }

      connect();
    </script>
  </body>
</html>
