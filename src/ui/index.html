<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>rrtree — live request trees</title>
    <style>
      :root {
        --bg: #0f1419;
        --panel: #1a2332;
        --border: #2d3a4d;
        --text: #e7ecf3;
        --muted: #8b9bb4;
        --accent: #3d9cf0;
        --redirect: #e0a106;
        --parser: #6bcb77;
        --script: #c792ea;
        --script_nav: #ff6b9d;
        --user_interaction: #4fd1c5;
        --preload: #718096;
        --other: #a0aec0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background: radial-gradient(1200px 600px at 10% -10%, #1a2a44, var(--bg));
        color: var(--text);
        min-height: 100vh;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 1rem;
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--border);
        background: color-mix(in srgb, var(--panel) 80%, transparent);
        backdrop-filter: blur(8px);
        position: sticky;
        top: 0;
        z-index: 2;
      }
      h1 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .status {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .status.ok {
        color: var(--parser);
      }
      main {
        display: grid;
        grid-template-columns: 280px 1fr 360px;
        gap: 0;
        min-height: calc(100vh - 57px);
      }
      @media (max-width: 960px) {
        main {
          grid-template-columns: 1fr;
        }
      }
      aside,
      section,
      article {
        border-right: 1px solid var(--border);
        padding: 0.75rem;
        overflow: auto;
        max-height: calc(100vh - 57px);
      }
      article {
        border-right: none;
      }
      h2 {
        margin: 0 0 0.75rem;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .tree-list button,
      .node {
        display: block;
        width: 100%;
        text-align: left;
        background: transparent;
        border: 1px solid transparent;
        color: var(--text);
        padding: 0.45rem 0.55rem;
        border-radius: 6px;
        cursor: pointer;
        font: inherit;
        margin-bottom: 0.25rem;
      }
      .tree-list button:hover,
      .node:hover {
        background: var(--panel);
        border-color: var(--border);
      }
      .tree-list button.active {
        border-color: var(--accent);
        background: color-mix(in srgb, var(--accent) 15%, transparent);
      }
      .toolbar {
        display: flex;
        gap: 0.4rem;
        margin-bottom: 0.75rem;
        flex-wrap: wrap;
      }
      .toolbar button {
        flex: 1;
        min-width: 0;
        font: inherit;
        font-size: 0.75rem;
        padding: 0.4rem 0.5rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
      }
      .toolbar button:hover:not(:disabled) {
        border-color: var(--accent);
      }
      .toolbar button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .toolbar button.danger:hover:not(:disabled) {
        border-color: #e06c75;
        color: #ffb4b4;
      }
      .tree-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.25rem;
        align-items: stretch;
        margin-bottom: 0.25rem;
      }
      .tree-row .pick {
        margin-bottom: 0;
      }
      .tree-row .del {
        width: 2rem;
        padding: 0;
        margin: 0;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 1rem;
        line-height: 1;
      }
      .tree-row .del:hover {
        color: #ffb4b4;
        border-color: var(--border);
        background: var(--panel);
      }
      .node.selected {
        border-color: var(--accent);
        background: color-mix(in srgb, var(--accent) 12%, transparent);
      }
      .edge {
        display: inline-block;
        font-size: 0.65rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 0.1rem 0.35rem;
        border-radius: 3px;
        margin-right: 0.35rem;
        background: var(--border);
        color: var(--bg);
      }
      .edge.redirect {
        background: var(--redirect);
      }
      .edge.parser {
        background: var(--parser);
      }
      .edge.script {
        background: var(--script);
      }
      .edge.script_nav {
        background: var(--script_nav);
      }
      .edge.user_interaction {
        background: var(--user_interaction);
      }
      .edge.preload {
        background: var(--preload);
      }
      .url {
        word-break: break-all;
        font-size: 0.82rem;
      }
      .meta {
        color: var(--muted);
        font-size: 0.72rem;
        margin-top: 0.15rem;
      }
      .children {
        margin-left: 0.85rem;
        border-left: 1px dashed var(--border);
        padding-left: 0.35rem;
      }
      .toggle {
        display: inline-block;
        width: 1rem;
        color: var(--muted);
        user-select: none;
      }
      pre {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.75rem;
        overflow: auto;
        font-size: 0.75rem;
        max-height: 50vh;
        white-space: pre-wrap;
        word-break: break-word;
      }
      dl {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 0.35rem 0.5rem;
        font-size: 0.85rem;
        margin: 0 0 1rem;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>rrtree</h1>
      <span id="status" class="status">connecting…</span>
    </header>
    <main>
      <aside>
        <h2>Trees</h2>
        <div class="toolbar">
          <button type="button" id="btn-delete-selected" class="danger" disabled>
            Delete selected
          </button>
          <button type="button" id="btn-clear-all" class="danger">
            Clear all
          </button>
        </div>
        <div id="tree-list" class="tree-list"></div>
      </aside>
      <section>
        <h2>Request tree</h2>
        <div id="tree-view"></div>
      </section>
      <article>
        <h2>Selected RR</h2>
        <div id="detail"><p class="meta">Select a node</p></div>
      </article>
    </main>
    <script>
      const state = {
        trees: [],
        nodesByTree: new Map(),
        selectedTreeId: null,
        selectedNodeId: null,
        collapsed: new Set(),
      };

      const el = {
        status: document.getElementById("status"),
        treeList: document.getElementById("tree-list"),
        treeView: document.getElementById("tree-view"),
        detail: document.getElementById("detail"),
        btnDeleteSelected: document.getElementById("btn-delete-selected"),
        btnClearAll: document.getElementById("btn-clear-all"),
      };

      async function refreshTrees() {
        const res = await fetch("/trees");
        const data = await res.json();
        state.trees = data.trees || [];
        // Drop cached nodes for trees that no longer exist.
        for (const id of [...state.nodesByTree.keys()]) {
          if (!state.trees.find((t) => t.id === id)) state.nodesByTree.delete(id);
        }
        if (
          state.selectedTreeId &&
          !state.trees.find((t) => t.id === state.selectedTreeId)
        ) {
          state.selectedTreeId = null;
          state.selectedNodeId = null;
          renderDetail(null);
        }
        renderTreeList();
        if (!state.selectedTreeId && state.trees.length) {
          await selectTree(state.trees[state.trees.length - 1].id);
        } else if (state.selectedTreeId) {
          await loadTree(state.selectedTreeId);
        } else {
          renderTree();
        }
      }

      async function loadTree(id) {
        const res = await fetch(`/trees/${encodeURIComponent(id)}`);
        if (!res.ok) {
          if (res.status === 404) {
            removeTreeLocal(id);
            renderTreeList();
            renderTree();
          }
          return;
        }
        const data = await res.json();
        const map = new Map();
        for (const n of data.nodes || []) map.set(n.id, n);
        state.nodesByTree.set(id, map);
        renderTree();
      }

      async function selectTree(id) {
        state.selectedTreeId = id;
        state.selectedNodeId = null;
        renderTreeList();
        await loadTree(id);
        renderDetail(null);
      }

      function removeTreeLocal(treeId) {
        state.trees = state.trees.filter((t) => t.id !== treeId);
        state.nodesByTree.delete(treeId);
        if (state.selectedTreeId === treeId) {
          state.selectedTreeId = null;
          state.selectedNodeId = null;
          renderDetail(null);
        }
      }

      async function deleteTree(treeId) {
        if (!treeId) return;
        const res = await fetch(`/trees/${encodeURIComponent(treeId)}`, {
          method: "DELETE",
        });
        if (!res.ok && res.status !== 404) {
          el.status.textContent = "delete failed";
          return;
        }
        removeTreeLocal(treeId);
        renderTreeList();
        if (!state.selectedTreeId && state.trees.length) {
          await selectTree(state.trees[0].id);
        } else {
          renderTree();
        }
        el.status.textContent = `live · ${state.trees.length} trees`;
      }

      async function clearAllTrees() {
        if (!state.trees.length) return;
        if (!confirm(`Delete all ${state.trees.length} trees?`)) return;
        const res = await fetch("/trees", { method: "DELETE" });
        if (!res.ok) {
          el.status.textContent = "clear failed";
          return;
        }
        state.trees = [];
        state.nodesByTree.clear();
        state.selectedTreeId = null;
        state.selectedNodeId = null;
        renderTreeList();
        renderTree();
        renderDetail(null);
        el.status.textContent = "live · 0 trees";
      }

      function upsertNode(patch) {
        const { treeId, node } = patch;
        if (!treeId || !node) return;
        if (!state.nodesByTree.has(treeId)) state.nodesByTree.set(treeId, new Map());
        state.nodesByTree.get(treeId).set(node.id, node);
        if (!state.trees.find((t) => t.id === treeId)) {
          state.trees.push({
            id: treeId,
            rootId: node.parentId ? undefined : node.id,
            updatedAt: node.updatedAt,
            createdAt: node.createdAt,
            targetId: node.targetId,
          });
        } else {
          const t = state.trees.find((t) => t.id === treeId);
          t.updatedAt = node.updatedAt;
          if (!node.parentId) t.rootId = node.id;
        }
        if (state.selectedTreeId === treeId) {
          renderTreeList();
          renderTree();
          if (state.selectedNodeId === node.id) renderDetail(node);
        } else {
          renderTreeList();
        }
      }

      function renderTreeList() {
        const sorted = [...state.trees].sort((a, b) => b.updatedAt - a.updatedAt);
        el.treeList.innerHTML = sorted
          .map((t) => {
            const nodes = state.nodesByTree.get(t.id);
            const root = nodes?.get(t.rootId);
            const label = root?.url || t.id;
            const short = label.length > 48 ? label.slice(0, 45) + "…" : label;
            const active = t.id === state.selectedTreeId ? "active" : "";
            return `<div class="tree-row">
              <button type="button" class="pick ${active}" data-id="${t.id}" title="${escapeAttr(label)}">${escapeHtml(short)}<div class="meta">${nodes?.size || "?"} nodes</div></button>
              <button type="button" class="del" data-id="${t.id}" title="Delete tree" aria-label="Delete tree">×</button>
            </div>`;
          })
          .join("");
        el.treeList.querySelectorAll("button.pick").forEach((btn) => {
          btn.addEventListener("click", () => selectTree(btn.dataset.id));
        });
        el.treeList.querySelectorAll("button.del").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            void deleteTree(btn.dataset.id);
          });
        });
        el.btnDeleteSelected.disabled = !state.selectedTreeId;
      }

      function renderTree() {
        const id = state.selectedTreeId;
        if (!id) {
          el.treeView.innerHTML = `<p class="meta">No tree selected</p>`;
          return;
        }
        const nodes = state.nodesByTree.get(id);
        const tree = state.trees.find((t) => t.id === id);
        if (!nodes || !tree) {
          el.treeView.innerHTML = `<p class="meta">Loading…</p>`;
          return;
        }
        const root = nodes.get(tree.rootId);
        if (!root) {
          el.treeView.innerHTML = `<p class="meta">Empty tree</p>`;
          return;
        }
        el.treeView.innerHTML = renderNodeHtml(root, nodes, 0);
        el.treeView.querySelectorAll(".node").forEach((n) => {
          n.addEventListener("click", (e) => {
            e.stopPropagation();
            const nid = n.dataset.id;
            state.selectedNodeId = nid;
            renderTree();
            renderDetail(nodes.get(nid));
          });
        });
        el.treeView.querySelectorAll(".toggle").forEach((t) => {
          t.addEventListener("click", (e) => {
            e.stopPropagation();
            const nid = t.dataset.id;
            if (state.collapsed.has(nid)) state.collapsed.delete(nid);
            else state.collapsed.add(nid);
            renderTree();
          });
        });
      }

      function renderNodeHtml(node, nodes, depth) {
        const kids = (node.children || [])
          .map((cid) => nodes.get(cid))
          .filter(Boolean);
        const hasKids = kids.length > 0;
        const collapsed = state.collapsed.has(node.id);
        const selected = node.id === state.selectedNodeId ? "selected" : "";
        const edge = node.edgeType
          ? `<span class="edge ${node.edgeType}">${node.edgeType}</span>`
          : depth === 0
            ? `<span class="edge other">root</span>`
            : "";
        const status =
          node.status != null
            ? node.status
            : node.failed
              ? "ERR"
              : node.hasResponse
                ? "…"
                : "→";
        let html = `<div class="node ${selected}" data-id="${node.id}">
          <div>${hasKids ? `<span class="toggle" data-id="${node.id}">${collapsed ? "▶" : "▼"}</span>` : `<span class="toggle"> </span>`}${edge}<span class="url">${escapeHtml(node.method)} ${escapeHtml(shortUrl(node.url))}</span></div>
          <div class="meta">${escapeHtml(String(node.resourceType))} · ${status}${node.mimeType ? " · " + escapeHtml(node.mimeType) : ""}</div>
        </div>`;
        if (hasKids && !collapsed) {
          html += `<div class="children">${kids.map((k) => renderNodeHtml(k, nodes, depth + 1)).join("")}</div>`;
        }
        return html;
      }

      function renderDetail(node) {
        if (!node) {
          el.detail.innerHTML = `<p class="meta">Select a node</p>`;
          return;
        }
        const reqBody = formatBody(node.requestBody);
        const resBody = formatBody(node.responseBody) ||
          (node.bodyPreview
            ? escapeHtml(node.bodyPreview.slice(0, 16000))
            : `<span class="meta">—</span>`);
        el.detail.innerHTML = `
          <dl>
            <dt>URL</dt><dd>${escapeHtml(node.url)}</dd>
            <dt>Method</dt><dd>${escapeHtml(node.method)}</dd>
            <dt>Type</dt><dd>${escapeHtml(node.resourceType)}</dd>
            <dt>Status</dt><dd>${node.status ?? "—"} ${escapeHtml(node.statusText || "")}</dd>
            <dt>Edge</dt><dd>${escapeHtml(node.edgeType || "root")}</dd>
            <dt>Initiator</dt><dd>${escapeHtml(node.initiator?.type || "—")}</dd>
            <dt>MIME</dt><dd>${escapeHtml(node.mimeType || "—")}</dd>
            <dt>Request ID</dt><dd>${escapeHtml(node.requestId)}</dd>
          </dl>
          <h2>Request headers</h2>
          <pre>${escapeHtml(JSON.stringify(node.requestHeaders || {}, null, 2))}</pre>
          <h2>Request body</h2>
          <pre>${reqBody}</pre>
          <h2>Response headers</h2>
          <pre>${escapeHtml(JSON.stringify(node.responseHeaders || {}, null, 2))}</pre>
          <h2>Response body</h2>
          <pre>${resBody}</pre>
          ${node.errorText ? `<h2>Error</h2><pre>${escapeHtml(node.errorText)}</pre>` : ""}
        `;
      }

      function formatBody(body) {
        if (!body) return `<span class="meta">— (none)</span>`;
        if (body.unavailableReason) {
          return `<span class="meta">— (${escapeHtml(body.unavailableReason)})</span>`;
        }
        const note = body.truncated
          ? `\n… truncated (original ${body.size ?? "?"} bytes)`
          : "";
        if (body.text != null) {
          return escapeHtml(body.text.slice(0, 16000) + note);
        }
        if (body.base64) {
          return escapeHtml(
            `[base64 ${body.size ?? "?"} bytes]` +
              (body.truncated ? " truncated" : "") +
              "\n" +
              body.base64.slice(0, 2000),
          );
        }
        return `<span class="meta">—</span>`;
      }

      function shortUrl(u) {
        try {
          const x = new URL(u);
          return x.pathname + x.search || x.href;
        } catch {
          return u;
        }
      }
      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function escapeAttr(s) {
        return escapeHtml(s).replace(/'/g, "&#39;");
      }

      async function connect() {
        try {
          const h = await fetch("/health");
          const health = await h.json();
          el.status.textContent = `ok · ${health.attachedTargets?.length || 0} targets · ${health.treeCount || 0} trees`;
          el.status.classList.add("ok");
          await refreshTrees();
        } catch (e) {
          el.status.textContent = "API unreachable";
          el.status.classList.remove("ok");
        }

        el.btnDeleteSelected.addEventListener("click", () => {
          if (state.selectedTreeId) void deleteTree(state.selectedTreeId);
        });
        el.btnClearAll.addEventListener("click", () => {
          void clearAllTrees();
        });

        const es = new EventSource("/events");
        es.onmessage = (msg) => {
          try {
            const data = JSON.parse(msg.data);
            if (data.op === "snapshot") {
              state.trees = data.trees || state.trees;
              renderTreeList();
              return;
            }
            if (data.op === "upsert" || data.op === "attach") {
              upsertNode(data);
              el.status.textContent = `live · ${state.trees.length} trees`;
              return;
            }
            if (data.op === "delete" && data.treeId) {
              removeTreeLocal(data.treeId);
              renderTreeList();
              if (!state.selectedTreeId && state.trees.length) {
                void selectTree(state.trees[0].id);
              } else {
                renderTree();
              }
              el.status.textContent = `live · ${state.trees.length} trees`;
              return;
            }
            if (data.op === "clear") {
              state.trees = [];
              state.nodesByTree.clear();
              state.selectedTreeId = null;
              state.selectedNodeId = null;
              renderTreeList();
              renderTree();
              renderDetail(null);
              el.status.textContent = "live · 0 trees";
            }
          } catch {
            /* ignore */
          }
        };
        es.onerror = () => {
          el.status.textContent = "SSE reconnecting…";
          el.status.classList.remove("ok");
        };
      }

      connect();
    </script>
  </body>
</html>
